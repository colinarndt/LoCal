[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-calendar"
version = "0.4.1"
description = "A local event calendar built from Instagram, venue, and performer sources."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai>=2.0",
    "apify-client>=1.7",
    "python-dotenv>=1.0",
    "flask>=3.0",
    # Windows ships no IANA tz database, so zoneinfo rejects every timezone name
    # and `init` silently falls back to the default.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# The menubar app. Kept optional so a headless/Linux install does not pull in
# a macOS-only dependency tree.
app = [
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
# Primary LoCal commands.
local-calendar = "local_calendar.cli:main"
local-calendar-web = "local_calendar.web:main"
# Kept for existing installs while they move to the LoCal names.
social-calendar = "local_calendar.cli:main"
social-calendar-web = "local_calendar.web:main"

[tool.setuptools.packages.find]
include = ["local_calendar*"]

# Jinja templates are loaded from `Path(__file__).parent / "templates"`, so they
# must travel with the package -- an install without them serves 500s on every
# page, and py2app needs them declared here to bundle them at all.
[tool.setuptools.package-data]
local_calendar = ["templates/*.html", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
